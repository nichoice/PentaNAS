definitions:
  controllers.AnomalyDetectionResponse:
    properties:
      alerts:
        items:
          $ref: '#/definitions/controllers.SecurityAlert'
        type: array
      risk_score:
        type: number
      suspicious_activities:
        items:
          $ref: '#/definitions/controllers.SuspiciousActivity'
        type: array
    type: object
  controllers.AssignRoleRequest:
    properties:
      role_id:
        enum:
        - super_admin
        - normal_user
        - audit_user
        - ops_user
        type: string
      user_id:
        type: string
    required:
    - role_id
    - user_id
    type: object
  controllers.AuditStatsResponse:
    properties:
      daily_stats:
        items:
          $ref: '#/definitions/controllers.DailyStats'
        type: array
      failed_count:
        type: integer
      hourly_stats:
        items:
          $ref: '#/definitions/controllers.HourlyStats'
        type: array
      operation_stats:
        items:
          $ref: '#/definitions/controllers.OperationStat'
        type: array
      recent_activities:
        items:
          $ref: '#/definitions/controllers.FileAuditLogResponse'
        type: array
      success_count:
        type: integer
      top_files:
        items:
          $ref: '#/definitions/controllers.FileAccessStat'
        type: array
      total_count:
        type: integer
      user_stats:
        items:
          $ref: '#/definitions/controllers.UserStat'
        type: array
    type: object
  controllers.CreateUserRequest:
    properties:
      is_active:
        type: boolean
      password:
        minLength: 8
        type: string
      remark:
        type: string
      role:
        enum:
        - super_admin
        - normal_user
        - audit_user
        - ops_user
        type: string
      username:
        maxLength: 20
        minLength: 3
        type: string
    required:
    - password
    - role
    - username
    type: object
  controllers.CreateVGRequest:
    properties:
      devices:
        items:
          type: string
        type: array
      vg_name:
        example: my_volume_group
        type: string
    required:
    - devices
    - vg_name
    type: object
  controllers.DailyStats:
    properties:
      count:
        type: integer
      date:
        type: string
    type: object
  controllers.FileAccessStat:
    properties:
      access_count:
        type: integer
      file_name:
        type: string
      file_path:
        type: string
      file_size:
        type: integer
      last_access:
        type: string
      user_count:
        type: integer
    type: object
  controllers.FileAuditLogResponse:
    properties:
      client_ip:
        type: string
      created_at:
        type: string
      file_path:
        type: string
      id:
        type: string
      message:
        type: string
      operation:
        type: string
      source:
        type: string
      success:
        type: boolean
      updated_at:
        type: string
      user_id:
        type: string
      username:
        type: string
    type: object
  controllers.HourlyStats:
    properties:
      count:
        type: integer
      hour:
        type: integer
    type: object
  controllers.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  controllers.LoginResponse:
    properties:
      expires_at:
        type: string
      token:
        type: string
      user_id:
        type: string
      username:
        type: string
    type: object
  controllers.OperationStat:
    properties:
      count:
        type: integer
      operation:
        type: string
      percentage:
        type: number
    type: object
  controllers.RevokeRoleRequest:
    properties:
      role_id:
        enum:
        - super_admin
        - normal_user
        - audit_user
        - ops_user
        type: string
      user_id:
        type: string
    required:
    - role_id
    - user_id
    type: object
  controllers.RoleResponse:
    properties:
      description:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  controllers.SecurityAlert:
    properties:
      count:
        type: integer
      description:
        type: string
      first_time:
        type: string
      last_time:
        type: string
      severity:
        type: string
      type:
        type: string
    type: object
  controllers.SuspiciousActivity:
    properties:
      count:
        type: integer
      description:
        type: string
      first_time:
        type: string
      last_time:
        type: string
      operation:
        type: string
      risk_level:
        type: string
      time_range:
        type: string
      user_id:
        type: string
      username:
        type: string
    type: object
  controllers.UpdateUserRequest:
    properties:
      is_active:
        type: boolean
      password:
        minLength: 8
        type: string
      remark:
        type: string
      role:
        enum:
        - super_admin
        - normal_user
        - audit_user
        - ops_user
        type: string
    type: object
  controllers.UpdateUserStatusRequest:
    properties:
      is_active:
        type: boolean
    required:
    - is_active
    type: object
  controllers.UserResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      last_login:
        type: string
      remark:
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
  controllers.UserStat:
    properties:
      count:
        type: integer
      last_activity:
        type: string
      user_id:
        type: string
      username:
        type: string
    type: object
  dto.CPUInfo:
    properties:
      cache_size:
        type: integer
      cores:
        type: integer
      family:
        type: string
      load_avg:
        $ref: '#/definitions/dto.LoadAvgInfo'
      model_name:
        type: string
      per_cpu:
        items:
          $ref: '#/definitions/dto.PerCPUInfo'
        type: array
      speed_mhz:
        type: number
      temperature:
        type: number
      threads:
        type: integer
      usage_percent:
        items:
          type: number
        type: array
    type: object
  dto.CreateLVRequest:
    properties:
      lv_name:
        type: string
      size:
        type: string
      vg_name:
        type: string
    required:
    - lv_name
    - size
    - vg_name
    type: object
  dto.CreateSambaAccountRequest:
    properties:
      description:
        type: string
      is_enabled:
        type: boolean
      password:
        minLength: 6
        type: string
      role:
        enum:
        - samba_admin
        - samba_user
        - samba_guest
        - samba_backup
        - samba_timemachine
        type: string
      samba_user:
        maxLength: 50
        minLength: 3
        type: string
      user_id:
        type: string
    required:
    - password
    - role
    - samba_user
    - user_id
    type: object
  dto.CreateSambaShareRequest:
    properties:
      allow_guest:
        type: boolean
      browseable:
        type: boolean
      comment:
        type: string
      create_mask:
        type: string
      directory_mask:
        type: string
      enable_multi_channel:
        type: boolean
      enable_recycle_bin:
        type: boolean
      enable_time_machine:
        description: 高级功能配置
        type: boolean
      force_create_mode:
        type: string
      force_directory_mode:
        type: string
      guest_only:
        type: boolean
      is_enabled:
        type: boolean
      name:
        maxLength: 100
        minLength: 1
        type: string
      path:
        type: string
      recycle_bin_path:
        type: string
      time_machine_quota:
        type: integer
      writable:
        type: boolean
    required:
    - name
    - path
    type: object
  dto.CreateVGRequest:
    properties:
      devices:
        items:
          type: string
        type: array
      vg_name:
        type: string
    required:
    - devices
    - vg_name
    type: object
  dto.DiskIOInfo:
    properties:
      io_time:
        type: integer
      iops_in_progress:
        type: integer
      merged_read_count:
        type: integer
      merged_write_count:
        type: integer
      name:
        type: string
      read_bytes:
        type: integer
      read_count:
        type: integer
      read_time:
        type: integer
      weighted_io:
        type: integer
      write_bytes:
        type: integer
      write_count:
        type: integer
      write_time:
        type: integer
    type: object
  dto.DiskInfo:
    properties:
      device:
        type: string
      free:
        type: integer
      fstype:
        type: string
      inodes_free:
        type: integer
      inodes_total:
        type: integer
      inodes_used:
        type: integer
      inodes_used_percent:
        type: number
      mountpoint:
        type: string
      total:
        type: integer
      used:
        type: integer
      used_percent:
        type: number
    type: object
  dto.DiskResponse:
    properties:
      avail_size:
        type: integer
      file_system:
        type: string
      health:
        type: string
      is_online:
        type: boolean
      is_system_disk:
        type: boolean
      maj_min:
        type: string
      model:
        type: string
      mount_point:
        type: string
      name:
        type: string
      path:
        type: string
      rota:
        type: boolean
      serial:
        type: string
      size:
        type: integer
      temperature:
        type: integer
      type:
        type: string
      usage_rate:
        type: number
      used_size:
        type: integer
      vendor:
        type: string
    type: object
  dto.ISCSITargetInfo:
    properties:
      iqn:
        type: string
      read_bytes:
        type: integer
      read_ops:
        type: integer
      sessions:
        type: integer
      status:
        type: string
      write_bytes:
        type: integer
      write_ops:
        type: integer
    type: object
  dto.LoadAvgInfo:
    properties:
      load1:
        type: number
      load5:
        type: number
      load15:
        type: number
    type: object
  dto.LogicalVolumeResponse:
    properties:
      lv_attr:
        type: string
      lv_name:
        type: string
      lv_size:
        type: string
      lv_uuid:
        type: string
      vg_name:
        type: string
    type: object
  dto.MemoryInfo:
    properties:
      active:
        type: integer
      available:
        type: integer
      buffers:
        type: integer
      cached:
        type: integer
      free:
        type: integer
      inactive:
        type: integer
      laundry:
        type: integer
      shared:
        type: integer
      slab:
        type: integer
      swap_free:
        type: integer
      swap_percent:
        type: number
      swap_total:
        type: integer
      swap_used:
        type: integer
      total:
        type: integer
      used:
        type: integer
      used_percent:
        type: number
      wired:
        type: integer
    type: object
  dto.MonitoringData:
    properties:
      cpu:
        $ref: '#/definitions/dto.CPUInfo'
      disk_io:
        items:
          $ref: '#/definitions/dto.DiskIOInfo'
        type: array
      disks:
        items:
          $ref: '#/definitions/dto.DiskInfo'
        type: array
      memory:
        $ref: '#/definitions/dto.MemoryInfo'
      network_io:
        items:
          $ref: '#/definitions/dto.NetworkIOInfo'
        type: array
      networks:
        items:
          $ref: '#/definitions/dto.NetworkInfo'
        type: array
      storage_protocols:
        items:
          $ref: '#/definitions/dto.StorageProtocolInfo'
        type: array
      system_info:
        $ref: '#/definitions/dto.SystemInfo'
      timestamp:
        type: string
    type: object
  dto.NetworkAddr:
    properties:
      addr:
        type: string
      net:
        type: string
    type: object
  dto.NetworkIOInfo:
    properties:
      bytes_recv:
        type: integer
      bytes_sent:
        type: integer
      dropin:
        type: integer
      dropout:
        type: integer
      errin:
        type: integer
      errout:
        type: integer
      fifoin:
        type: integer
      fifoout:
        type: integer
      name:
        type: string
      packets_recv:
        type: integer
      packets_sent:
        type: integer
    type: object
  dto.NetworkInfo:
    properties:
      addrs:
        items:
          $ref: '#/definitions/dto.NetworkAddr'
        type: array
      flags:
        items:
          type: string
        type: array
      hardware_addr:
        type: string
      mtu:
        type: integer
      name:
        type: string
    type: object
  dto.PerCPUInfo:
    properties:
      cpu:
        type: string
      guest:
        type: number
      idle:
        type: number
      iowait:
        type: number
      irq:
        type: number
      nice:
        type: number
      softirq:
        type: number
      steal:
        type: number
      system:
        type: number
      user:
        type: number
    type: object
  dto.ShareInfo:
    properties:
      connections:
        type: integer
      name:
        type: string
      path:
        type: string
      protocol:
        type: string
      read_bytes:
        type: integer
      read_ops:
        type: integer
      status:
        type: string
      write_bytes:
        type: integer
      write_ops:
        type: integer
    type: object
  dto.StorageOverviewResponse:
    properties:
      disks:
        items:
          $ref: '#/definitions/dto.DiskResponse'
        type: array
      logical_volumes:
        items:
          $ref: '#/definitions/dto.LogicalVolumeResponse'
        type: array
      total_disks:
        type: integer
      total_logical_volumes:
        type: integer
      total_volume_groups:
        type: integer
      volume_groups:
        items:
          $ref: '#/definitions/dto.VolumeGroupResponse'
        type: array
    type: object
  dto.StorageProtocolInfo:
    properties:
      connections:
        type: integer
      protocol:
        type: string
      shares:
        items:
          $ref: '#/definitions/dto.ShareInfo'
        type: array
      statistics:
        additionalProperties: true
        type: object
      status:
        type: string
      targets:
        items:
          $ref: '#/definitions/dto.ISCSITargetInfo'
        type: array
    type: object
  dto.SystemInfo:
    properties:
      boot_time:
        type: string
      host_id:
        type: string
      hostname:
        type: string
      kernel_arch:
        type: string
      kernel_version:
        type: string
      os:
        type: string
      platform:
        type: string
      platform_family:
        type: string
      platform_version:
        type: string
      procs:
        type: integer
      uptime:
        type: integer
    type: object
  dto.UpdateSambaAccountRequest:
    properties:
      description:
        type: string
      is_enabled:
        type: boolean
      password:
        minLength: 6
        type: string
      role:
        enum:
        - samba_admin
        - samba_user
        - samba_guest
        - samba_backup
        - samba_timemachine
        type: string
    type: object
  dto.UpdateSambaShareRequest:
    properties:
      allow_guest:
        type: boolean
      browseable:
        type: boolean
      comment:
        type: string
      create_mask:
        type: string
      directory_mask:
        type: string
      enable_multi_channel:
        type: boolean
      enable_recycle_bin:
        type: boolean
      enable_time_machine:
        description: 高级功能配置
        type: boolean
      force_create_mode:
        type: string
      force_directory_mode:
        type: string
      guest_only:
        type: boolean
      is_enabled:
        type: boolean
      recycle_bin_path:
        type: string
      time_machine_quota:
        type: integer
      writable:
        type: boolean
    type: object
  dto.VolumeGroupResponse:
    properties:
      vg_attr:
        type: string
      vg_extent_count:
        type: string
      vg_extent_size:
        type: string
      vg_free:
        type: string
      vg_free_count:
        type: string
      vg_name:
        type: string
      vg_size:
        type: string
      vg_uuid:
        type: string
    type: object
  dto.WebSocketMessage:
    properties:
      client_id:
        type: string
      data: {}
      timestamp:
        type: string
      type:
        type: string
    type: object
  errors.ErrorResponse:
    properties:
      code:
        type: integer
      error:
        type: string
      message:
        type: string
    type: object
info:
  contact: {}
paths:
  /api/v1/samba/accounts:
    get:
      consumes:
      - application/json
      description: 分页获取Samba账号列表，支持角色过滤
      parameters:
      - default: 0
        description: 偏移量
        in: query
        name: offset
        type: integer
      - default: 10
        description: 每页数量
        in: query
        name: limit
        type: integer
      - description: 角色过滤
        in: query
        name: role
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 内部服务器错误
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 获取Samba账号列表
      tags:
      - Samba账号管理
    post:
      consumes:
      - application/json
      description: 创建新的Samba账号用于文件共享访问
      parameters:
      - description: 创建账号请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateSambaAccountRequest'
      produces:
      - application/json
      responses:
        "201":
          description: 创建成功
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 内部服务器错误
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 创建Samba账号
      tags:
      - Samba账号管理
  /api/v1/samba/accounts/{id}:
    delete:
      consumes:
      - application/json
      description: 根据ID删除指定的Samba账号
      parameters:
      - description: 账号ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 内部服务器错误
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 删除Samba账号
      tags:
      - Samba账号管理
    get:
      consumes:
      - application/json
      description: 根据ID获取指定Samba账号的详细信息
      parameters:
      - description: 账号ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            additionalProperties: true
            type: object
        "404":
          description: 账号不存在
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 内部服务器错误
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 获取单个Samba账号
      tags:
      - Samba账号管理
    put:
      consumes:
      - application/json
      description: 更新指定Samba账号的信息
      parameters:
      - description: 账号ID
        in: path
        name: id
        required: true
        type: string
      - description: 更新账号请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateSambaAccountRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 内部服务器错误
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 更新Samba账号
      tags:
      - Samba账号管理
  /api/v1/samba/monitoring/audit/logs:
    get:
      consumes:
      - application/json
      description: 分页获取Samba操作审计日志，支持多种过滤条件
      parameters:
      - default: 0
        description: 偏移量
        in: query
        name: offset
        type: integer
      - default: 10
        description: 每页数量
        in: query
        name: limit
        type: integer
      - description: 用户名过滤
        in: query
        name: username
        type: string
      - description: 客户端IP过滤
        in: query
        name: client_ip
        type: string
      - description: 共享名称过滤
        in: query
        name: share_name
        type: string
      - description: 操作类型过滤
        in: query
        name: operation
        type: string
      - description: 成功状态过滤
        in: query
        name: success
        type: boolean
      - description: 开始时间过滤(RFC3339格式)
        in: query
        name: start_time
        type: string
      - description: 结束时间过滤(RFC3339格式)
        in: query
        name: end_time
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 内部服务器错误
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 获取Samba审计日志
      tags:
      - Samba监控管理
  /api/v1/samba/monitoring/connections:
    get:
      consumes:
      - application/json
      description: 获取当前Samba服务的所有活跃连接信息
      produces:
      - application/json
      responses:
        "200":
          description: 活跃连接列表
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 内部服务器错误
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 获取当前活跃连接
      tags:
      - Samba监控管理
  /api/v1/samba/monitoring/status:
    get:
      consumes:
      - application/json
      description: 获取Samba服务的整体运行状态和统计信息
      produces:
      - application/json
      responses:
        "200":
          description: 状态信息
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 内部服务器错误
          schema:
            additionalProperties:
              type: string
