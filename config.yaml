server:
  port: "8080"
  debug: false
  version: 1.0.0
  title: PNAS - Personal Network Attached Storage
  description: 个人网络附加存储系统
database:
  path: pnas.db
jwt:
  secret: your-secret-key-change-this
  expire: 24
audit:
  enabled: true
  watchpaths:
  - /wuzhou
  excludepatterns:
  - .DS_Store
  - .Spotlight-V100
  - .Trashes
  - .fseventsd
  - .TemporaryItems
  - Thumbs.db
  - desktop.ini
  - ~$*
  - .tmp
  - .temp
  - .swp
  - .~
  - '#*'
  - '*.log'
  - '*.lock'
  batchsize: 100
  flushinterval: 5
  recursivewatch: true
  enableapi: true
  enablefilesystem: true
  retentiondays: 90
