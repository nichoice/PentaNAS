basePath: /api/v1
definitions:
  controllers.AssignRoleRequest:
    properties:
      role_id:
        enum:
        - super_admin
        - normal_user
        - audit_user
        - ops_user
        type: string
      user_id:
        type: string
    required:
    - role_id
    - user_id
    type: object
  controllers.CreateUserRequest:
    properties:
      is_active:
        type: boolean
      password:
        minLength: 8
        type: string
      remark:
        type: string
      role:
        enum:
        - super_admin
        - normal_user
        - audit_user
        - ops_user
        type: string
      username:
        maxLength: 20
        minLength: 3
        type: string
    required:
    - password
    - role
    - username
    type: object
  controllers.CreateVGRequest:
    properties:
      devices:
        items:
          type: string
        type: array
      vg_name:
        example: my_volume_group
        type: string
    required:
    - devices
    - vg_name
    type: object
  controllers.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  controllers.LoginResponse:
    properties:
      expires_at:
        type: string
      token:
        type: string
      user_id:
        type: string
      username:
        type: string
    type: object
  controllers.RevokeRoleRequest:
    properties:
      role_id:
        enum:
        - super_admin
        - normal_user
        - audit_user
        - ops_user
        type: string
      user_id:
        type: string
    required:
    - role_id
    - user_id
    type: object
  controllers.RoleResponse:
    properties:
      description:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  controllers.UpdateUserRequest:
    properties:
      is_active:
        type: boolean
      password:
        minLength: 8
        type: string
      remark:
        type: string
      role:
        enum:
        - super_admin
        - normal_user
        - audit_user
        - ops_user
        type: string
    type: object
  controllers.UpdateUserStatusRequest:
    properties:
      is_active:
        type: boolean
    required:
    - is_active
    type: object
  controllers.UserResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      last_login:
        type: string
      remark:
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
  dto.CPUInfo:
    properties:
      cache_size:
        type: integer
      cores:
        type: integer
      family:
        type: string
      load_avg:
        $ref: '#/definitions/dto.LoadAvgInfo'
      model_name:
        type: string
      per_cpu:
        items:
          $ref: '#/definitions/dto.PerCPUInfo'
        type: array
      speed_mhz:
        type: number
      temperature:
        type: number
      threads:
        type: integer
      usage_percent:
        items:
          type: number
        type: array
    type: object
  dto.CreateLVRequest:
    properties:
      lv_name:
        type: string
      size:
        type: string
      vg_name:
        type: string
    required:
    - lv_name
    - size
    - vg_name
    type: object
  dto.CreateVGRequest:
    properties:
      devices:
        items:
          type: string
        type: array
      vg_name:
        type: string
    required:
    - devices
    - vg_name
    type: object
  dto.DiskIOInfo:
    properties:
      io_time:
        type: integer
      iops_in_progress:
        type: integer
      merged_read_count:
        type: integer
      merged_write_count:
        type: integer
      name:
        type: string
      read_bytes:
        type: integer
      read_count:
        type: integer
      read_time:
        type: integer
      weighted_io:
        type: integer
      write_bytes:
        type: integer
      write_count:
        type: integer
      write_time:
        type: integer
    type: object
  dto.DiskInfo:
    properties:
      device:
        type: string
      free:
        type: integer
      fstype:
        type: string
      inodes_free:
        type: integer
      inodes_total:
        type: integer
      inodes_used:
        type: integer
      inodes_used_percent:
        type: number
      mountpoint:
        type: string
      total:
        type: integer
      used:
        type: integer
      used_percent:
        type: number
    type: object
  dto.DiskResponse:
    properties:
      avail_size:
        type: integer
      file_system:
        type: string
      health:
        type: string
      is_online:
        type: boolean
      is_system_disk:
        type: boolean
      maj_min:
        type: string
      model:
        type: string
      mount_point:
        type: string
      name:
        type: string
      path:
        type: string
      rota:
        type: boolean
      serial:
        type: string
      size:
        type: integer
      temperature:
        type: integer
      type:
        type: string
      usage_rate:
        type: number
      used_size:
        type: integer
      vendor:
        type: string
    type: object
  dto.ISCSITargetInfo:
    properties:
      iqn:
        type: string
      read_bytes:
        type: integer
      read_ops:
        type: integer
      sessions:
        type: integer
      status:
        type: string
      write_bytes:
        type: integer
      write_ops:
        type: integer
    type: object
  dto.LoadAvgInfo:
    properties:
      load1:
        type: number
      load5:
        type: number
      load15:
        type: number
    type: object
  dto.LogicalVolumeResponse:
    properties:
      lv_attr:
        type: string
      lv_name:
        type: string
      lv_size:
        type: string
      lv_uuid:
        type: string
      vg_name:
        type: string
    type: object
  dto.MemoryInfo:
    properties:
      active:
        type: integer
      available:
        type: integer
      buffers:
        type: integer
      cached:
        type: integer
      free:
        type: integer
      inactive:
        type: integer
      laundry:
        type: integer
      shared:
        type: integer
      slab:
        type: integer
      swap_free:
        type: integer
      swap_percent:
        type: number
      swap_total:
        type: integer
      swap_used:
        type: integer
      total:
        type: integer
      used:
        type: integer
      used_percent:
        type: number
      wired:
        type: integer
    type: object
  dto.MonitoringData:
    properties:
      cpu:
        $ref: '#/definitions/dto.CPUInfo'
      disk_io:
        items:
          $ref: '#/definitions/dto.DiskIOInfo'
        type: array
      disks:
        items:
          $ref: '#/definitions/dto.DiskInfo'
        type: array
      memory:
        $ref: '#/definitions/dto.MemoryInfo'
      network_io:
        items:
          $ref: '#/definitions/dto.NetworkIOInfo'
        type: array
      networks:
        items:
          $ref: '#/definitions/dto.NetworkInfo'
        type: array
      storage_protocols:
        items:
          $ref: '#/definitions/dto.StorageProtocolInfo'
        type: array
      system_info:
        $ref: '#/definitions/dto.SystemInfo'
      timestamp:
        type: string
    type: object
  dto.NetworkAddr:
    properties:
      addr:
        type: string
      net:
        type: string
    type: object
  dto.NetworkIOInfo:
    properties:
      bytes_recv:
        type: integer
      bytes_sent:
        type: integer
      dropin:
        type: integer
      dropout:
        type: integer
      errin:
        type: integer
      errout:
        type: integer
      fifoin:
        type: integer
      fifoout:
        type: integer
      name:
        type: string
      packets_recv:
        type: integer
      packets_sent:
        type: integer
    type: object
  dto.NetworkInfo:
    properties:
      addrs:
        items:
          $ref: '#/definitions/dto.NetworkAddr'
        type: array
      flags:
        items:
          type: string
        type: array
      hardware_addr:
        type: string
      mtu:
        type: integer
      name:
        type: string
    type: object
  dto.PerCPUInfo:
    properties:
      cpu:
        type: string
      guest:
        type: number
      idle:
        type: number
      iowait:
        type: number
      irq:
        type: number
      nice:
        type: number
      softirq:
        type: number
      steal:
        type: number
      system:
        type: number
      user:
        type: number
    type: object
  dto.ShareInfo:
    properties:
      connections:
        type: integer
      name:
        type: string
      path:
        type: string
      protocol:
        type: string
      read_bytes:
        type: integer
      read_ops:
        type: integer
      status:
        type: string
      write_bytes:
        type: integer
      write_ops:
        type: integer
    type: object
  dto.StorageOverviewResponse:
    properties:
      disks:
        items:
          $ref: '#/definitions/dto.DiskResponse'
        type: array
      logical_volumes:
        items:
          $ref: '#/definitions/dto.LogicalVolumeResponse'
        type: array
      total_disks:
        type: integer
      total_logical_volumes:
        type: integer
      total_volume_groups:
        type: integer
      volume_groups:
        items:
          $ref: '#/definitions/dto.VolumeGroupResponse'
        type: array
    type: object
  dto.StorageProtocolInfo:
    properties:
      connections:
        type: integer
      protocol:
        type: string
      shares:
        items:
          $ref: '#/definitions/dto.ShareInfo'
        type: array
      statistics:
        additionalProperties: true
        type: object
      status:
        type: string
      targets:
        items:
          $ref: '#/definitions/dto.ISCSITargetInfo'
        type: array
    type: object
  dto.SystemInfo:
    properties:
      boot_time:
        type: string
      host_id:
        type: string
      hostname:
        type: string
      kernel_arch:
        type: string
      kernel_version:
        type: string
      os:
        type: string
      platform:
        type: string
      platform_family:
        type: string
      platform_version:
        type: string
      procs:
        type: integer
      uptime:
        type: integer
    type: object
  dto.VolumeGroupResponse:
    properties:
      vg_attr:
        type: string
      vg_extent_count:
        type: string
      vg_extent_size:
        type: string
      vg_free:
        type: string
      vg_free_count:
        type: string
      vg_name:
        type: string
      vg_size:
        type: string
      vg_uuid:
        type: string
    type: object
  dto.WebSocketMessage:
    properties:
      client_id:
        type: string
      data: {}
      timestamp:
        type: string
      type:
        type: string
    type: object
  errors.ErrorResponse:
    properties:
      code:
        type: integer
      error:
        type: string
      message:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: HarborArk系统API文档
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: HarborArk
  version: 0.0.1
paths:
  /api/v1/storage/disks:
    get:
      consumes:
      - application/json
      description: 获取系统中所有磁盘的信息
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.DiskResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      summary: 获取磁盘列表
      tags:
      - 存储管理
  /api/v1/storage/lvs:
    get:
      consumes:
      - application/json
      description: 获取LVM逻辑卷信息
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.LogicalVolumeResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      summary: 获取逻辑卷列表
      tags:
      - 存储管理
    post:
      consumes:
      - application/json
      description: 创建LVM逻辑卷
      parameters:
      - description: 创建逻辑卷请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateLVRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      summary: 创建逻辑卷
      tags:
      - 存储管理
  /api/v1/storage/overview:
    get:
      consumes:
      - application/json
      description: 获取存储系统整体概览信息
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.StorageOverviewResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      summary: 获取存储概览
      tags:
      - 存储管理
  /api/v1/storage/vgs:
    get:
      consumes:
      - application/json
      description: 获取LVM卷组信息
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.VolumeGroupResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      summary: 获取卷组列表
      tags:
      - 存储管理
    post:
      consumes:
      - application/json
      description: 创建LVM卷组
      parameters:
      - description: 创建卷组请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateVGRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      summary: 创建卷组
      tags:
      - 存储管理
  /auth/assign:
    post:
      consumes:
      - application/json
      description: Assign a predefined role to a user
      parameters:
      - description: Role assignment details
        in: body
        name: assignment
        required: true
        schema:
          $ref: '#/definitions/controllers.AssignRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Assign role to user
      tags:
      - Authorization
  /auth/revoke:
    post:
      consumes:
      - application/json
      description: Revoke a role from a user
      parameters:
      - description: Role revocation details
        in: body
        name: revocation
        required: true
        schema:
          $ref: '#/definitions/controllers.RevokeRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Revoke role from user
      tags:
      - Authorization
  /auth/roles/{role_id}/users:
    get:
      consumes:
      - application/json
      description: Get users assigned to a role
      parameters:
      - description: Role ID
        in: path
        name: role_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get role users
      tags:
      - Authorization
  /auth/users/{user_id}/roles:
    get:
      consumes:
      - application/json
      description: Get roles assigned to a user
      parameters:
      - description: User ID
        in: path
        name: user_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get user roles
      tags:
      - Authorization
  /login:
    post:
      consumes:
      - application/json
      description: Authenticate user and return JWT token
      parameters:
      - description: Login credentials
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/controllers.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.LoginResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: User login
      tags:
      - Authentication
  /monitoring/complete:
    get:
      consumes:
      - application/json
      description: Get all available monitoring data in a single response
      produces:
      - application/json
      responses:
        "200":
          description: Complete monitoring data
          schema:
            $ref: '#/definitions/dto.MonitoringData'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get complete monitoring data
      tags:
      - Monitoring
  /monitoring/cpu:
    get:
      consumes:
      - application/json
      description: Get detailed CPU information including usage, load average, and
        per-CPU statistics
      produces:
      - application/json
      responses:
        "200":
          description: CPU information
          schema:
            $ref: '#/definitions/dto.CPUInfo'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get CPU information
      tags:
      - Monitoring
  /monitoring/disk:
    get:
      consumes:
      - application/json
      description: Get detailed disk information including usage and I/O statistics
      produces:
      - application/json
      responses:
        "200":
          description: Disk information including usage and I/O
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get disk information
      tags:
      - Monitoring
  /monitoring/memory:
    get:
      consumes:
      - application/json
      description: Get detailed memory information including RAM and swap usage
      produces:
      - application/json
      responses:
        "200":
          description: Memory information
          schema:
            $ref: '#/definitions/dto.MemoryInfo'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get memory information
      tags:
      - Monitoring
  /monitoring/metrics:
    get:
      consumes:
      - application/json
      description: Get system metrics in Prometheus format for monitoring integration
      produces:
      - text/plain
      responses:
        "200":
          description: Prometheus metrics format
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get system metrics
      tags:
      - Monitoring
  /monitoring/network:
    get:
      consumes:
      - application/json
      description: Get detailed network information including interfaces and I/O statistics
      produces:
      - application/json
      responses:
        "200":
          description: Network information including interfaces and I/O
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get network information
      tags:
      - Monitoring
  /monitoring/service/status:
    get:
      consumes:
      - application/json
      description: Get status information for specific system services
      parameters:
      - description: Service name to check
        in: query
        name: service
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Service status information
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get service status
      tags:
      - Monitoring
  /monitoring/storage-protocols:
    get:
      consumes:
      - application/json
      description: Get monitoring information for storage protocols (SMB, NFS, iSCSI)
      produces:
      - application/json
      responses:
        "200":
          description: Storage protocol information
          schema:
            items:
              $ref: '#/definitions/dto.StorageProtocolInfo'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get storage protocol information
      tags:
      - Monitoring
  /monitoring/system:
    get:
      consumes:
      - application/json
      description: Get detailed system information including OS, kernel, hardware
        details
      produces:
      - application/json
      responses:
        "200":
          description: System information
          schema:
            $ref: '#/definitions/dto.SystemInfo'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get system information
      tags:
      - Monitoring
  /monitoring/websocket:
    get:
      consumes:
      - application/json
      description: Establish WebSocket connection for real-time monitoring data
      produces:
      - application/json
      responses:
        "101":
          description: Switching Protocols
