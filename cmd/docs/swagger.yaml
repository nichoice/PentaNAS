      id:
        type: string
      name:
        type: string
    type: object
  controllers.SecurityAlert:
    properties:
      count:
        type: integer
      description:
        type: string
      first_time:
        type: string
      last_time:
        type: string
      severity:
        type: string
      type:
        type: string
    type: object
  controllers.SuspiciousActivity:
    properties:
      count:
        type: integer
      description:
        type: string
      first_time:
        type: string
      last_time:
        type: string
      operation:
        type: string
      risk_level:
        type: string
      time_range:
        type: string
      user_id:
        type: string
      username:
        type: string
    type: object
  controllers.UpdateUserRequest:
    properties:
      is_active:
        type: boolean
      password:
        minLength: 8
        type: string
      remark:
        type: string
      role:
        enum:
        - super_admin
        - normal_user
        - audit_user
        - ops_user
        type: string
    type: object
  controllers.UpdateUserStatusRequest:
    properties:
      is_active:
        type: boolean
    required:
    - is_active
    type: object
  controllers.UserResponse:
    properties:
