definitions:
  controllers.AnomalyDetectionResponse:
    properties:
      alerts:
        items:
          $ref: '#/definitions/controllers.SecurityAlert'
        type: array
      risk_score:
        type: number
      suspicious_activities:
        items:
          $ref: '#/definitions/controllers.SuspiciousActivity'
        type: array
    type: object
  controllers.AssignRoleRequest:
    properties:
      role_id:
        enum:
        - super_admin
        - normal_user
        - audit_user
        - ops_user
        type: string
      user_id:
        type: string
    required:
    - role_id
    - user_id
    type: object
  controllers.AuditStatsResponse:
    properties:
      daily_stats:
        items:
          $ref: '#/definitions/controllers.DailyStats'
        type: array
      failed_count:
        type: integer
      hourly_stats:
        items:
          $ref: '#/definitions/controllers.HourlyStats'
        type: array
      operation_stats:
        items:
          $ref: '#/definitions/controllers.OperationStat'
        type: array
      recent_activities:
        items:
          $ref: '#/definitions/controllers.FileAuditLogResponse'
        type: array
      success_count:
        type: integer
      top_files:
        items:
          $ref: '#/definitions/controllers.FileAccessStat'
        type: array
      total_count:
        type: integer
      user_stats:
        items:
          $ref: '#/definitions/controllers.UserStat'
        type: array
    type: object
  controllers.CreateUserRequest:
    properties:
      is_active:
        type: boolean
      password:
        minLength: 8
        type: string
      remark:
        type: string
      role:
        enum:
        - super_admin
        - normal_user
        - audit_user
        - ops_user
        type: string
      username:
        maxLength: 20
        minLength: 3
        type: string
    required:
    - password
    - role
    - username
    type: object
  controllers.CreateVGRequest:
    properties:
      devices:
        items:
          type: string
        type: array
      vg_name:
        example: my_volume_group
        type: string
    required:
    - devices
    - vg_name
    type: object
  controllers.DailyStats:
    properties:
      count:
        type: integer
      date:
        type: string
    type: object
  controllers.FileAccessStat:
    properties:
      access_count:
        type: integer
      file_name:
        type: string
      file_path:
        type: string
      file_size:
        type: integer
      last_access:
        type: string
      user_count:
        type: integer
    type: object
  controllers.FileAuditLogResponse:
    properties:
      client_ip:
        type: string
      created_at:
        type: string
      file_path:
        type: string
      id:
        type: string
      message:
        type: string
      operation:
        type: string
      source:
        type: string
      success:
        type: boolean
      updated_at:
        type: string
      user_id:
        type: string
      username:
        type: string
    type: object
  controllers.HourlyStats:
    properties:
      count:
        type: integer
      hour:
        type: integer
    type: object
  controllers.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  controllers.LoginResponse:
    properties:
      expires_at:
        type: string
      token:
        type: string
      user_id:
        type: string
      username:
        type: string
    type: object
  controllers.OperationStat:
    properties:
      count:
        type: integer
      operation:
        type: string
      percentage:
        type: number
    type: object
  controllers.RevokeRoleRequest:
    properties:
      role_id:
        enum:
        - super_admin
        - normal_user
        - audit_user
        - ops_user
        type: string
      user_id:
        type: string
    required:
    - role_id
    - user_id
    type: object
