info:
  contact: {}
paths:
  /api/v1/samba/accounts:
    get:
      consumes:
      - application/json
      description: 分页获取Samba账号列表，支持角色过滤
      parameters:
      - default: 0
        description: 偏移量
        in: query
        name: offset
        type: integer
      - default: 10
        description: 每页数量
        in: query
        name: limit
        type: integer
      - description: 角色过滤
        in: query
        name: role
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 内部服务器错误
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 获取Samba账号列表
      tags:
      - Samba账号管理
    post:
      consumes:
      - application/json
      description: 创建新的Samba账号用于文件共享访问
      parameters:
      - description: 创建账号请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateSambaAccountRequest'
      produces:
      - application/json
      responses:
        "201":
          description: 创建成功
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 内部服务器错误
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 创建Samba账号
      tags:
      - Samba账号管理
  /api/v1/samba/accounts/{id}:
    delete:
      consumes:
      - application/json
      description: 根据ID删除指定的Samba账号
      parameters:
      - description: 账号ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 内部服务器错误
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 删除Samba账号
      tags:
      - Samba账号管理
    get:
      consumes:
      - application/json
      description: 根据ID获取指定Samba账号的详细信息
      parameters:
      - description: 账号ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            additionalProperties: true
            type: object
        "404":
          description: 账号不存在
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 内部服务器错误
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 获取单个Samba账号
      tags:
      - Samba账号管理
    put:
      consumes:
      - application/json
      description: 更新指定Samba账号的信息
      parameters:
      - description: 账号ID
        in: path
        name: id
        required: true
        type: string
      - description: 更新账号请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateSambaAccountRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 内部服务器错误
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 更新Samba账号
      tags:
      - Samba账号管理
  /api/v1/samba/monitoring/audit/logs:
    get:
      consumes:
      - application/json
      description: 分页获取Samba操作审计日志，支持多种过滤条件
      parameters:
      - default: 0
        description: 偏移量
        in: query
        name: offset
        type: integer
      - default: 10
        description: 每页数量
        in: query
        name: limit
        type: integer
      - description: 用户名过滤
        in: query
