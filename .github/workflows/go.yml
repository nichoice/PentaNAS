# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"

      - name: Install iSCSI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends targetcli-fb tcmu-runner sg3-utils
          nohup sudo tcmu-runner >/tmp/tcmu-runner.log 2>&1 &
          sleep 2
          sudo targetcli / status || true

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...

      - name: Run application smoke test
        run: go run main.go serve --help
